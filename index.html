<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VYUHAK // ORBITAL INTELLIGENCE PROTOCOL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Leaflet for 2D Tactical Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #02040a; font-family: 'Space Grotesk', sans-serif; color: #e2e8f0; user-select: none; }
        .mono-telemetry { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

        /* Viewports */
        #globe-viewport, #map-viewport { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #map-viewport { display: none; z-index: 2; } /* Hidden by default */
        
        /* UI Layer */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; pointer-events: none; }

        /* Glassmorphism */
        .obsidian-glass {
            background: rgba(6, 11, 20, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .pointer-events-auto { pointer-events: auto; }
        ::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Custom UI Elements */
        .btn-active { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; color: #38bdf8; }
        .hud-brackets { position: relative; }
        .hud-brackets::before, .hud-brackets::after { content: ''; position: absolute; width: 6px; height: 6px; border-color: #38bdf8; border-style: solid; transition: all 0.3s ease; }
        .hud-brackets::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
        .hud-brackets::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

        /* Leaflet Customization */
        .leaflet-control-zoom { display: none; }
        .leaflet-container { background: #02040a; }
    </style>
</head>
<body>

    <!-- 3D Earth Viewport -->
    <div id="globe-viewport"></div>
    
    <!-- 2D Tactical Map Viewport -->
    <div id="map-viewport"></div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        
        <!-- TOP SECTION -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-start w-full">
            
            <!-- Left: Telemetry Panel -->
            <div class="obsidian-glass hud-brackets pointer-events-auto rounded-md p-3 w-full md:w-80 shrink-0">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h1 class="text-[12px] font-bold tracking-widest text-sky-400">VYUHAK<span class="text-slate-400 font-normal"> // OSINT</span></h1>
                    </div>
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
                </div>
                
                <div class="grid grid-cols-2 gap-y-3 gap-x-2 text-[10px] uppercase text-slate-400 mono-telemetry">
                    <div>
                        <div class="mb-0.5 opacity-70">Sat Callsign</div>
                        <div class="text-sky-100 font-bold" id="hud-sat-name">VK-SENTINEL-01</div>
                    </div>
                    <div>
                        <div class="mb-0.5 opacity-70">Target Time</div>
                        <div class="text-amber-400 font-bold" id="hud-time">UTC 12:45:00</div>
                    </div>
                    <div>
                        <div class="mb-0.5 opacity-70">Alt / Vel</div>
                        <div class="text-slate-200"><span id="hud-alt">400</span>KM / <span id="hud-vel">7.59</span>KPS</div>
                    </div>
                    <div>
                        <div class="mb-0.5 opacity-70">Nadir Lat/Lon</div>
                        <div class="text-emerald-400"><span id="hud-lat">0.00</span>&deg;, <span id="hud-lon">0.00</span>&deg;</div>
                    </div>
                </div>
            </div>

            <!-- Center: Engine & Camera Controls -->
            <div class="pointer-events-auto flex flex-col items-center gap-2">
                <!-- 3D / 2D Toggle -->
                <div class="obsidian-glass rounded-md flex p-1 border border-slate-700/50">
                    <button id="btn-3d" onclick="switchEngine('3D')" class="btn-active px-4 py-1.5 rounded text-[10px] font-bold tracking-wider transition-colors w-24">3D GLOBE</button>
                    <button id="btn-2d" onclick="switchEngine('2D')" class="px-4 py-1.5 rounded text-[10px] font-bold tracking-wider text-slate-400 hover:text-white transition-colors w-24">2D TACTICAL</button>
                </div>
                <!-- Camera Modes (Only visible in 3D) -->
                <div id="cam-controls" class="obsidian-glass rounded-md flex p-1 border border-slate-700/50">
                    <button id="cam-free" onclick="switchCamera('FREE')" class="btn-active px-3 py-1 rounded text-[9px] font-bold tracking-wider">FREE</button>
                    <button id="cam-chase" onclick="switchCamera('CHASE')" class="px-3 py-1 rounded text-[9px] font-bold tracking-wider text-slate-400 hover:text-white">CHASE</button>
                    <button id="cam-nadir" onclick="switchCamera('NADIR')" class="px-3 py-1 rounded text-[9px] font-bold tracking-wider text-slate-400 hover:text-white">NADIR</button>
                </div>
            </div>

            <!-- Right: Actions -->
            <div class="flex flex-row md:flex-col gap-2 pointer-events-auto overflow-x-auto hide-scrollbar w-full md:w-32 shrink-0">
                <button onclick="toggleGeoLock()" id="btn-geo-lock" class="obsidian-glass hud-brackets px-3 py-2 rounded-md text-[10px] font-bold tracking-wide hover:bg-white/10 transition-colors flex items-center justify-between min-w-[110px]">
                    <span>GEO LOCK</span>
                    <span id="lock-indicator" class="text-slate-500 ml-2">OFF</span>
                </button>
                <button class="obsidian-glass px-3 py-2 rounded-md text-[10px] uppercase tracking-wider text-slate-300 hover:text-white transition-colors flex justify-between items-center group min-w-[110px]">
                    <span>PALETTE</span>
                    <span class="bg-white/10 px-1 rounded text-[8px] ml-2">&#8984;K</span>
                </button>
            </div>
        </div>

    </div>

    <!-- LOGIC & ENGINE INIT -->
    <script>
        // State
        let activeEngine = '3D'; // 3D or 2D
        let activeCamera = 'FREE'; // FREE, CHASE, NADIR
        let isGeoLocked = false;
        
        // Orbital Math
        let orbitTime = 0;
        const orbitRadius = 1.35; // Earth radius = 1
        const orbitSpeed = 0.002;
        let satLat = 0;
        let satLon = 0;
        
        // --- 1. THREE.JS 3D ENGINE ---
        const scene = new THREE.Scene();
        
        // Textures (NASA Blue Marble style from reliable CDN)
        const texLoader = new THREE.TextureLoader();
        const earthDayTex = texLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const earthBumpTex = texLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');
        const earthWaterTex = texLoader.load('https://unpkg.com/three-globe/example/img/earth-water.png');
        
        // Camera & Renderer
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 3.5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('globe-viewport').appendChild(renderer.domElement);
        
        // OrbitControls for Free Cam
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.1;
        controls.maxDistance = 6;
        
        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.15)); // Dark space
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(5, 1, 3); // Sun position to create day/night terminator
        scene.add(sunLight);
        
        // Earth Sphere
        const earthGeo = new THREE.SphereGeometry(1, 64, 64);
        const earthMat = new THREE.MeshPhongMaterial({
            map: earthDayTex,
            bumpMap: earthBumpTex,
            bumpScale: 0.015,
            specularMap: earthWaterTex,
            specular: new THREE.Color(0x333333),
            shininess: 15
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        scene.add(earthMesh);
        
        // Atmospheric Glow
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.1, side: THREE.BackSide });
        const glowMesh = new THREE.Mesh(new THREE.SphereGeometry(1.025, 32, 32), glowMat);
        scene.add(glowMesh);
        
        // Satellite 3D Model Assembly
        const satGroup = new THREE.Group();
        
        // Bus (Gold Foil)
        const busGeo = new THREE.BoxGeometry(0.04, 0.04, 0.08);
        const busMat = new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.8 });
        satGroup.add(new THREE.Mesh(busGeo, busMat));
        
        // Solar Panels (Blue)
        const panelGeo = new THREE.PlaneGeometry(0.18, 0.05);
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, side: THREE.DoubleSide, metalness: 0.5 });
        const panelL = new THREE.Mesh(panelGeo, panelMat);
        panelL.position.x = -0.11;
        satGroup.add(panelL);
        const panelR = new THREE.Mesh(panelGeo, panelMat);
        panelR.position.x = 0.11;
        satGroup.add(panelR);
        
        // Laser Scanning Cone
        const coneGeo = new THREE.ConeGeometry(0.3, 1, 32, 1, true);
        coneGeo.translate(0, -0.5, 0); // pivot at tip
        const coneMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.2, wireframe: true });
        const laserCone = new THREE.Mesh(coneGeo, coneMat);
        satGroup.add(laserCone);
        
        scene.add(satGroup);

        // --- 2. LEAFLET 2D ENGINE ---
        const map = L.map('map-viewport', { zoomControl: false, attributionControl: false }).setView([0, 0], 3);
        
        // Esri World Imagery Tile Layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 17
        }).addTo(map);
        
        // Satellite Marker
        const satIcon = L.divIcon({
            html: `<div style="width:16px;height:16px;background:#ef4444;border-radius:50%;border:2px solid white;box-shadow:0 0 10px #ef4444;"></div>`,
            className: '', iconSize: [16, 16], iconAnchor: [8, 8]
        });
        const satMarker = L.marker([0, 0], { icon: satIcon }).addTo(map);
        
        // --- UI INTERACTION LOGIC ---
        function switchEngine(mode) {
            activeEngine = mode;
            document.getElementById('globe-viewport').style.display = (mode === '3D') ? 'block' : 'none';
            document.getElementById('map-viewport').style.display = (mode === '2D') ? 'block' : 'none';
            document.getElementById('cam-controls').style.opacity = (mode === '3D') ? '1' : '0';
            
            // Button Styles
            document.getElementById('btn-3d').className = (mode === '3D') ? 'btn-active px-4 py-1.5 rounded text-[10px] font-bold tracking-wider transition-colors w-24' : 'px-4 py-1.5 rounded text-[10px] font-bold tracking-wider text-slate-400 hover:text-white transition-colors w-24';
            document.getElementById('btn-2d').className = (mode === '2D') ? 'btn-active px-4 py-1.5 rounded text-[10px] font-bold tracking-wider transition-colors w-24' : 'px-4 py-1.5 rounded text-[10px] font-bold tracking-wider text-slate-400 hover:text-white transition-colors w-24';
            
            if(mode === '2D') { map.invalidateSize(); } // Fix leaflet render bug when unhiding
        }

        function switchCamera(mode) {
            activeCamera = mode;
            const btns = ['cam-free', 'cam-chase', 'cam-nadir'];
            btns.forEach(id => {
                document.getElementById(id).className = 'px-3 py-1 rounded text-[9px] font-bold tracking-wider text-slate-400 hover:text-white';
            });
            document.getElementById(`cam-${mode.toLowerCase()}`).className = 'btn-active px-3 py-1 rounded text-[9px] font-bold tracking-wider';
        }

        function toggleGeoLock() {
            isGeoLocked = !isGeoLocked;
            const btn = document.getElementById('btn-geo-lock');
            const ind = document.getElementById('lock-indicator');
            const satName = document.getElementById('hud-sat-name');
            const vel = document.getElementById('hud-vel');
            
            if(isGeoLocked) {
                btn.classList.add('bg-sky-900/40', 'border-sky-400');
                ind.textContent = 'ON'; ind.classList.replace('text-slate-500', 'text-sky-400');
                satName.textContent = 'VK-GEO-02 [FIXED]';
                vel.textContent = '0.00';
            } else {
                btn.classList.remove('bg-sky-900/40', 'border-sky-400');
                ind.textContent = 'OFF'; ind.classList.replace('text-sky-400', 'text-slate-500');
                satName.textContent = 'VK-SENTINEL-01';
                vel.textContent = '7.59';
            }
        }

        // --- ANIMATION & PHYSICS LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // Earth Rotation
            earthMesh.rotation.y += 0.0005;

            // Satellite Physics
            if (!isGeoLocked) {
                orbitTime += orbitSpeed;
                
                // Calculate 3D Position (Inclined orbit)
                satGroup.position.x = Math.cos(orbitTime) * orbitRadius;
                satGroup.position.z = Math.sin(orbitTime) * orbitRadius;
                satGroup.position.y = Math.sin(orbitTime * 0.7) * orbitRadius * 0.4; 
                
                // Make Satellite point laser directly at Earth center
                satGroup.lookAt(0,0,0);
                satGroup.rotateX(Math.PI / 2); // align cone
                
                // Math to extract Lat/Lon
                satLat = (Math.asin(satGroup.position.y / orbitRadius) * 180 / Math.PI).toFixed(2);
                
                // Adjust longitude for earth rotation so 2D map matches exactly
                let rawLon = (Math.atan2(satGroup.position.z, satGroup.position.x) * 180 / Math.PI);
                let earthRotDegrees = (earthMesh.rotation.y * 180 / Math.PI) % 360;
                satLon = (rawLon - earthRotDegrees);
                if (satLon < -180) satLon += 360;
                if (satLon > 180) satLon -= 360;
                satLon = satLon.toFixed(2);

                // Update UI Text
                document.getElementById('hud-lat').textContent = satLat;
                document.getElementById('hud-lon').textContent = satLon;
                
                // Sync Leaflet 2D Map Marker
                satMarker.setLatLng([satLat, satLon]);
                
                // Format UTC Time
                const d = new Date();
                document.getElementById('hud-time').textContent = 'UTC ' + d.toISOString().substr(11,8);
            }

            // Camera Logic
            if (activeCamera === 'FREE') {
                controls.update();
            } else if (activeCamera === 'CHASE') {
                // Position camera slightly behind and above satellite
                const offset = satGroup.position.clone().normalize().multiplyScalar(0.3); // up/out
                const backward = new THREE.Vector3(Math.cos(orbitTime - 0.1), Math.sin((orbitTime - 0.1) * 0.7) * 0.4, Math.sin(orbitTime - 0.1)).multiplyScalar(orbitRadius);
                
                const targetCamPos = backward.add(offset);
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(satGroup.position);
            } else if (activeCamera === 'NADIR') {
                // Position camera exactly on satellite, looking down laser cone at earth
                const targetCamPos = satGroup.position.clone().multiplyScalar(1.05); // just outside the bus
                camera.position.lerp(targetCamPos, 0.1);
                camera.lookAt(0,0,0);
            }

            renderer.render(scene, camera);
        }
        
        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();
    </script>
</body>
</html>
