<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VYUHAK | VK-Tracker-01 — Solar & Interior View</title>
  <link rel="stylesheet" href="src/css/main.css" />
</head>
<body class="vhk-app mode-solar">
  <!-- Top Telemetry & Mode HUD -->
  <header class="vhk-top-hud" id="vhk-top-hud">
    <div class="vhk-hud-bar">
      <div class="vhk-tracker-id">
        <span class="vhk-status-dot" aria-hidden="true"></span>
        <span>VYUHAK</span>
        <span class="vhk-divider">|</span>
        <span class="vhk-unit">VK-Tracker-01</span>
      </div>
      <div class="vhk-coord-readout" id="vhk-coords">41.15&deg;, -91.38&deg;</div>
    </div>

    <div class="vhk-telemetry-meta">
      <span id="vhk-alt-vel">ALT 1200 km &bull; VEL 7.26 km/s</span>
      <span class="vhk-color-mode" id="vhk-color-mode">True Color</span>
    </div>

    <nav class="vhk-domain-tabs" aria-label="Primary Space Domains">
      <button type="button" class="vhk-tab" data-domain="earth">Earth</button>
      <button type="button" class="vhk-tab is-active" data-domain="solar">Solar</button>
      <button type="button" class="vhk-tab" data-domain="galaxy">Galaxy</button>
      <button type="button" class="vhk-tab" data-domain="universe">Universe</button>
    </nav>

    <div class="vhk-camera-bar" aria-label="Camera Mode & Quick Zoom">
      <div class="vhk-seg">
        <button type="button" class="vhk-seg-btn is-active" data-dim="3d">3D</button>
        <button type="button" class="vhk-seg-btn" data-dim="2d">2D</button>
      </div>
      <button type="button" class="vhk-mini-btn" data-cam="free">Free</button>
      <button type="button" class="vhk-mini-btn" data-cam="hover">Hover</button>
      <button type="button" class="vhk-mini-btn" data-cam="iss">ISS</button>
      <button type="button" class="vhk-mini-btn is-active" data-cam="track">Track</button>
      <button type="button" class="vhk-mini-btn" data-zoom-preset="far">System</button>
      <button type="button" class="vhk-mini-btn" data-zoom-preset="close">Close Zoom</button>
    </div>

    <div class="vhk-body-pills" id="vhk-body-pills" role="tablist" aria-label="Solar System Bodies">
      <button type="button" class="vhk-body-pill" data-body="sun">Sun</button>
      <button type="button" class="vhk-body-pill" data-body="mercury">Mercury</button>
      <button type="button" class="vhk-body-pill is-active" data-body="venus">Venus</button>
      <button type="button" class="vhk-body-pill" data-body="earth">Earth</button>
      <button type="button" class="vhk-body-pill" data-body="mars">Mars</button>
      <button type="button" class="vhk-body-pill" data-body="jupiter">Jupiter</button>
      <button type="button" class="vhk-body-pill" data-body="saturn">Saturn</button>
    </div>
  </header>

  <!-- Full-Viewport Interactive Solar Canvas -->
  <main class="vhk-stage" id="vhk-stage">
    <canvas id="vhk-solar-canvas" aria-label="Heliocentric Solar System Canvas"></canvas>

    <!-- Non-blocking scale readout -->
    <div class="vhk-scale-badge" aria-hidden="true">
      <div class="vhk-scale-value" id="vhk-scale-value">1.12 billion km</div>
      <div class="vhk-scale-line"></div>
      <div class="vhk-scale-caption">HELIOCENTRIC SOLAR SYSTEM</div>
    </div>

    <!-- Lightweight camera distance scrubber (no layout thrashing) -->
    <div class="vhk-zoom-dock">
      <div class="vhk-zoom-row">
        <span id="vhk-zoom-status">System View (Zoomed Out)</span>
        <span id="vhk-dist-readout">DIST 120.0</span>
      </div>
      <input
        type="range"
        id="vhk-zoom-slider"
        min="3"
        max="160"
        step="0.5"
        value="120"
        aria-label="Camera Distance"
      />
    </div>

    <!-- Object Pop-Up: DIST / VEL / ESI/INFO & Interior/Core Details Shown ONLY When Zoomed Close or Inside Interior -->
    <aside id="vhk-object-popup" class="vhk-popup" aria-live="polite" hidden>
      <div class="vhk-popup-top">
        <div class="vhk-popup-heading">
          <div class="vhk-popup-badges">
            <span class="vhk-badge-domain" id="vhk-popup-domain">SOLAR</span>
            <span class="vhk-badge-type" id="vhk-popup-type">Terrestrial Planet</span>
          </div>
          <h2 class="vhk-popup-name" id="vhk-popup-name">Venus</h2>
        </div>
        <button type="button" class="vhk-interior-toggle" id="vhk-interior-toggle">
          Enter Interior &rarr;
        </button>
      </div>

      <div class="vhk-popup-summary" id="vhk-popup-summary">
        Sun: 0.72 AU &bull; 53.9M km &bull; Pinch/zoom close or tap Enter Interior
      </div>

      <div class="vhk-popup-deep" id="vhk-popup-deep" hidden>
        <div class="vhk-metrics">
          <div class="vhk-metric">
            <span class="vhk-metric-label">DIST</span>
            <strong class="vhk-metric-val" id="vhk-m-dist">0.72 AU</strong>
          </div>
          <div class="vhk-metric">
            <span class="vhk-metric-label">VEL</span>
            <strong class="vhk-metric-val" id="vhk-m-vel">35.2 km/s</strong>
          </div>
          <div class="vhk-metric">
            <span class="vhk-metric-label">ESI/INFO</span>
            <strong class="vhk-metric-val" id="vhk-m-esi">ESI 0.44</strong>
          </div>
        </div>
        <p class="vhk-popup-desc" id="vhk-popup-desc"></p>
      </div>
    </aside>
  </main>

  <!-- Bottom Navigation Bar -->
  <footer class="vhk-bottom-nav">
    <button type="button" class="vhk-nav-btn" data-nav="events">
      <span>Live Events</span>
      <span class="vhk-alert-pill">11</span>
    </button>
    <button type="button" class="vhk-nav-btn is-active" data-nav="solar">
      <span>Solar Data</span>
    </button>
    <button type="button" class="vhk-nav-btn" data-nav="settings">
      <span>Settings</span>
    </button>
  </footer>

  <script src="src/js/bodies-data.js"></script>
  <script src="src/js/popup-controller.js"></script>
  <script src="src/js/solar-renderer.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
